<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="TIENDA DE CAMISAS" content="width=device-width, initial-scale=1.0">
    <title>TIENDA DE CAMISAS</title>
    <link rel="stylesheet" href="Estilos1.CSS">
</head>
<body>
    <div class="login-container">
        <form action="TIENDACAMISAS.html">
            <h2>Acceso a la Tienda</h2>
            <div class="input-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" style="font-size: 30px;">Registrarse</button>
        </form>
    </div>
</body>
</html>
